name: Build Windows app
on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['app/version.json', 'package.json', 'main.js', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build installer (and publish it when this run was started by a version tag)
        run: npx electron-builder --win nsis --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
