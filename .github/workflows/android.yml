name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Bundle latest web app
        working-directory: mobile
        run: |
          mkdir -p www && cp -r ../app/. www/
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: everafter-inventory-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
