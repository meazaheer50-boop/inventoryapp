name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'app/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Bundle latest web app
        working-directory: mobile
        run: |
          mkdir -p www && cp -r ../app/. www/
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && (for i in 1 2 3 4; do ./gradlew assembleRelease --no-daemon && break; echo "Attempt $i failed, retrying"; sleep 20; [ $i = 4 ] && exit 1; done) && cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/everafter-inventory-$(node -p "require('../../app/version.json').version").apk
      - name: Verify the APK is signed
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in mobile/android/app/build/outputs/apk/release/everafter-inventory-*.apk; do "$AS" verify --verbose --print-certs "$f" | head -8; done
          # the release APK must not be debuggable
          AA=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if "$AA" dump badging mobile/android/app/build/outputs/apk/release/everafter-inventory-*.apk | grep -q "application-debuggable"; then echo "APK is debuggable"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: everafter-inventory-apk
          path: mobile/android/app/build/outputs/apk/release/everafter-inventory-*.apk
