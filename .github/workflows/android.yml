name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'app/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Bundle latest web app
        working-directory: mobile
        run: |
          mkdir -p www && cp -r ../app/. www/
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Use the app's fixed signing key (so a new APK installs over the old one)
        run: mkdir -p ~/.android && cp mobile/android/everafter-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && (for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && break; echo "Attempt $i failed, retrying"; sleep 20; [ $i = 4 ] && exit 1; done) && cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/everafter-inventory-$(node -p "require('../../app/version.json').version").apk
      - name: Verify the APK is signed
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in mobile/android/app/build/outputs/apk/debug/everafter-inventory-*.apk; do "$AS" verify --verbose --print-certs "$f" | head -8; done
      - uses: actions/upload-artifact@v4
        with:
          name: everafter-inventory-apk
          path: mobile/android/app/build/outputs/apk/debug/everafter-inventory-*.apk
